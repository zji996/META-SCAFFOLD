scaffold:
  contract_version: 6
  mode: existing
  execution_mode: preview_then_apply

repo:
  shape: monorepo
  app_dir: apps
  shared_dir: packages
  docs_entry: docs/current.md
  command_entry: pnpm

ai_collaboration:
  language: zh-first
  agent_entry: AGENTS.md
  # meta-scaffold is user-level only; do not vendor skills/meta-scaffold into this repo
  default_context:
    - AGENTS.md
    - docs/current.md
    - docs/reference/architecture.md
  preview_before_apply: true
  verify_after_apply: true
